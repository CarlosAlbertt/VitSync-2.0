# Perfil "local": apunta a los servicios del docker-compose de la raiz del repo.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Con datos de demostración (base vitsync_dev): profiles=local,demo (application-demo.properties).
#
# Estas credenciales son de desarrollo y son publicas a proposito. Ningun secreto
# real entra en el repositorio (gitleaks lo vigila en CI).

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/vitsync
spring.datasource.username=vitsync
spring.datasource.password=vitsync
# Mailpit: captura el correo saliente, bandeja en http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
vitsync.mail.from=no-reply@vitsync.test
# El worker revisa el outbox cada segundo: el email aparece en Mailpit casi al momento.
vitsync.outbox.worker.interval=1s

# En local interesa ver el health completo y las metricas.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.org.flywaydb=INFO

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Cifrado de desarrollo: clave de 32 bytes a cero y un pepper sin entropia. Son publicos
# a proposito y no protegen nada: KeyRing solo acepta la clave a cero con
# allow-insecure-dev-key=true, que solo existe en este perfil y en los tests.
vitsync.crypto.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
vitsync.crypto.key-version=v1
vitsync.crypto.blind-index-pepper=local-development-pepper-0000000000
vitsync.crypto.allow-insecure-dev-key=true

# JWT: sin claves en el repositorio (gitleaks). En local se genera un par RSA en memoria
# al arrancar; los tokens dejan de valer al reiniciar, que en desarrollo da igual.
vitsync.jwt.private-key=
vitsync.jwt.public-key=
vitsync.jwt.allow-ephemeral-keys=true
# Sin HTTPS en local: la cookie del refresh no puede ser Secure.
vitsync.auth.refresh-cookie.secure=false
