# Perfil "local": apunta a los servicios del docker-compose de la raiz del repo.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Estas credenciales son de desarrollo y son publicas a proposito. Ningun secreto
# real entra en el repositorio (gitleaks lo vigila en CI).

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/vitsync
spring.datasource.username=vitsync
spring.datasource.password=vitsync

# Mailpit: captura el correo saliente, bandeja en http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025

# En local interesa ver el health completo y las metricas.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.org.flywaydb=INFO
