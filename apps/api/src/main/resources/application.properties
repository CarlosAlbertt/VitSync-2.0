spring.application.name=vitsync-api

# ---------------------------------------------------------------------------
# Base de datos
# Sin valores por defecto a proposito: si falta una variable, la app no arranca
# (Anexo C de la guia: validar el entorno y fallar rapido).
# El perfil "local" sobreescribe estas tres con el docker-compose del repo.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ---------------------------------------------------------------------------
# Migraciones: Flyway manda sobre el esquema, Hibernate solo lo valida.
# ddl-auto=validate en TODOS los perfiles (decision D3): si Hibernate y Flyway
# discrepan, el fallo tiene que salir en local, no en produccion.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
server.servlet.context-path=/
spring.mvc.problemdetails.enabled=true

# ----------------------------
# -----------------------------------------------
# Actuator: health publico, el resto cerrado (guia, Fase 11.3).
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Contrato OpenAPI: apagado por defecto; se enciende en local y en los tests.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.writer-with-order-by-keys=true

# Paginacion: 20 por defecto y tope de 100 por pagina.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# El id de traza de cada peticion aparece en todas las lineas de log.
logging.pattern.correlation=[%X{traceId:-}] 
