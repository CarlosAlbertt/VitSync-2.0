spring.application.name=vitsync-api

# ---------------------------------------------------------------------------
# Base de datos
# Sin valores por defecto a proposito: si falta una variable, la app no arranca
# (Anexo C de la guia: validar el entorno y fallar rapido).
# El perfil "local" sobreescribe estas tres con el docker-compose del repo.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ---------------------------------------------------------------------------
# Migraciones: Flyway manda sobre el esquema, Hibernate solo lo valida.
# ddl-auto=validate en TODOS los perfiles (decision D3): si Hibernate y Flyway
# discrepan, el fallo tiene que salir en local, no en produccion.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Cifrado en reposo (ADR-0005). Sin valores por defecto, igual que la BD: si falta
# alguna variable, KeyRing o BlindIndex fallan al arrancar y la app no levanta.
# - ENCRYPTION_KEY: 32 bytes en base64 (openssl rand -base64 32).
# - ENCRYPTION_KEY_VERSION: v<n>; es el prefijo de todo lo que se cifra a partir de ahora.
# - BLIND_INDEX_PEPPER: 32+ caracteres, distinto de la clave y guardado aparte.
# Claves retiradas tras una rotacion (solo para descifrar):
#   VITSYNC_CRYPTO_PREVIOUS_KEYS_V1=<base64>  ->  vitsync.crypto.previous-keys.v1
# ---------------------------------------------------------------------------
vitsync.crypto.key=${ENCRYPTION_KEY}
vitsync.crypto.key-version=${ENCRYPTION_KEY_VERSION}
vitsync.crypto.blind-index-pepper=${BLIND_INDEX_PEPPER}

# ---------------------------------------------------------------------------
# Correo transaccional (outbox, modulo notification). SMTP generico: el proveedor
# se decide con el despliegue (Sprint 8). En local, Mailpit (perfil local).
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
vitsync.mail.from=${MAIL_FROM_ADDRESS}
# Worker del outbox: cada 5 s, lotes de 20, FAILED tras 8 intentos (~2 h de backoff).
vitsync.outbox.worker.interval=5s

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
server.servlet.context-path=/
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------------------------
# Actuator: health publico, el resto cerrado (guia, Fase 11.3).
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Contrato OpenAPI: apagado por defecto; se enciende en local y en los tests.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.writer-with-order-by-keys=true

# Paginacion: 20 por defecto y tope de 100 por pagina.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# El id de traza de cada peticion aparece en todas las lineas de log.
logging.pattern.correlation=[%X{traceId:-}] 
