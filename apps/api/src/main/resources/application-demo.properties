# Perfil "demo": datos de demostración en su propia base de datos (VIT-81).
# Uso, siempre junto a "local": ./mvnw spring-boot:run "-Dspring-boot.run.profiles=local,demo"
#
# Con este perfil se crean al arrancar los usuarios demo y el catálogo (DemoUsersSeeder,
# CatalogDemoSeeder), y van a vitsync_dev, no a vitsync: la base del perfil "local" solo queda
# vacía y sirve para probar flujos desde cero (registro, verificación...).
# vitsync_dev la crea el servicio db-init del docker-compose.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/vitsync_dev
