# Configuracion comun de los tests.
#
# Va en config/ y no en la raiz de test/resources a proposito: un application.properties
# en la raiz del classpath de test TAPARIA al de src/main (mismo nombre, mismo sitio) y
# los tests dejarian de usar la configuracion real. classpath:/config/ es otra ubicacion
# que Spring Boot carga ADEMAS de la raiz, y con mas prioridad: solo sobreescribe esto.
#
# Mismos valores de desarrollo que el perfil local: publicos, sin entropia, y solo
# aceptados porque allow-insecure-dev-key=true.
vitsync.crypto.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
vitsync.crypto.key-version=v1
vitsync.crypto.blind-index-pepper=test-only-pepper-00000000000000000000
vitsync.crypto.allow-insecure-dev-key=true

# HaveIBeenPwned apagado: ningun test depende de internet. Los que prueban el caso de
# contrasena filtrada simulan el BreachedPasswordChecker.
vitsync.hibp.enabled=false

# BCrypt con coste 4 (el minimo) solo en tests: con 12 cada registro tarda ~250 ms y la
# suite se alarga sin probar nada mas. Produccion y local usan 12.
vitsync.security.bcrypt-cost=4

# Correo: el host solo existe para que Spring cree el JavaMailSender; ningun test envia
# por SMTP (se simula EmailSender). El worker no corre solo: los tests lo invocan.
spring.mail.host=localhost
spring.mail.port=1025
vitsync.mail.from=no-reply@vitsync.test
vitsync.outbox.worker.enabled=false

# Estadisticas de Hibernate: los tests que vigilan el N+1 cuentan las consultas de una
# peticion (DoctorsApiTest). En produccion estan apagadas.
spring.jpa.properties.hibernate.generate_statistics=true

# JWT con par RSA efimero, generado al arrancar el contexto: ninguna clave en el repo.
vitsync.jwt.private-key=
vitsync.jwt.public-key=
vitsync.jwt.allow-ephemeral-keys=true
